name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The forge holds main and GitHub mirrors it; both run these jobs. The forge's setup-python toolcache is
# shared between jobs, so installs go into a job venv, and it ignores a job's timeout-minutes, so steps
# carry their own.
jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Test suite
        timeout-minutes: 20
        run: .venv/bin/python -m pytest -q

  experiments:
    name: experiments run
    runs-on: ubuntu-latest
    # The suite guards the computation; this guards that every experiment still
    # executes. A skipped experiment used to look exactly like a passing one.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[dev]"

      - name: Smoke-run every experiment
        timeout-minutes: 20
        run: .venv/bin/python tools/smoke_experiments.py
